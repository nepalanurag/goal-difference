name: refresh
on:
  schedule:
    # Daily 06:00 America/Los_Angeles. refresh.py is hash-gated: it exits
    # quietly when no finished fixture changed, so this effectively runs
    # once per matchday.
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt
      - name: Refresh data, refit models, rebuild site
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m etl.refresh
      - name: Commit updated data and site
        run: |
          git config user.name "goal-difference-bot"
          git config user.email "goal-difference-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Refresh: matchday data, refit models, rebuilt site"
          git push
